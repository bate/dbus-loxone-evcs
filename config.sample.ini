[DEFAULT]
# VRM device instance. Reuse the instance of a charger you replace to keep its history.
DeviceInstance = 43
# Name shown in the GX GUI and in VRM
CustomName = Wallbox
# Where the charger is wired: 0 = AC output (behind the inverter), 1 = AC input (grid side)
AcPosition = 1
# 1 or 3. Loxone only reports total power; it is split evenly across the phases.
Phases = 3
# Nominal voltage used to derive /Current and /SetCurrent from power
Voltage = 230
# Maximum charging current per phase in A (11 kW / 3 phases = 16 A)
MaxCurrent = 16
# Loxone charging modes (output M of the Wallbox block) that count as "Auto" (PV-controlled).
# All other modes are reported as "Manual".
AutoModes = 1,2
# What goes to /Ac/Energy/Forward: "session" (energy of the current charge, Victron EVCS behaviour)
# or "meter" (total meter reading of the wallbox)
EnergySource = session
# HTTP endpoint Loxone pushes to
ListenHost = 0.0.0.0
ListenPort = 8090
# Loxone repeats non-zero values (Virtual Output command "Repetition interval", 300 s) but never
# repeats a 0. Live values (power, session, connected, active, allowed, limit) that were not
# repeated for this many seconds fall back to 0, in case the change to 0 was lost.
# Keep it above two repetition intervals. 0 disables it.
StaleSeconds = 700
# Optional shared secret. If set, every request needs ?token=<value>.
Token =
# DEBUG logs every received value. Log rotates at 1 MB, 2 backups.
LogLevel = INFO
HeartbeatMinutes = 15
